name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore MateLauncher.slnx

      - name: Build
        run: dotnet build MateLauncher.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/MateLauncher.Tests -c Release --no-build --verbosity normal
