name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./build-release.ps1 -Version $version

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = (Get-ChildItem release/*.exe, release/*.zip, release/*.sha256).FullName
          $notes = "docs/releases/$tag.md"
          if (Test-Path $notes) {
            gh release create $tag $assets --title $tag --notes-file $notes
          } else {
            gh release create $tag $assets --title $tag --generate-notes
          }
